openapi: 3.0.3
info:
  title: AutoDev Marketplace Auth Service
  version: 1.0.0
  description: Authentication and authorization service

servers:
  - url: http://auth-service:8082
    description: Docker environment
  - url: http://localhost:8082
    description: Local development

paths:
  /api/v1/auth/login:
    post:
      summary: Login user
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many login attempts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
                
  /api/v1/auth/refresh:
    post:
      summary: Refresh access token
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
                
  /api/v1/auth/logout:
    post:
      summary: Logout user
      tags:
        - Authentication
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Successfully logged out
        '401':
          description: Unauthorized
          
  /api/v1/auth/me:
    get:
      summary: Get current user from Redis cache (synchronized from Keycloak)
      tags:
        - Authentication
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        '401':
          description: Unauthorized
  
  /api/v1/auth/verify:
    get:
      summary: Verify token validity
      tags:
        - Authentication
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Token is valid
        '401':
          description: Token is invalid or expired

  /api/v1/auth/keys:
    get:
      summary: Get Keycloak public keys for JWT validation
      tags:
        - Authentication
      responses:
        '200':
          description: Keycloak public keys
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      properties:
                        kid:
                          type: string
                          example: "abc123"
                        e:
                          type: string
                          example: "AQAB"
                        n:
                          type: string
                          example: "long_rsa_public_key"
        '500':
          description: Internal server error

  /api/v1/auth/sync:
    post:
      summary: Sync user data from Keycloak webhook
      tags:
        - Webhook
      description: Endpoint for receiving Keycloak events (user_created, user_updated, user_enabled, user_disabled) and synchronizing with PostgreSQL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookEvent'
      responses:
        '200':
          description: Event processed successfully
        '400':
          description: Invalid event format
        '500':
          description: Internal server error

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          minLength: 8
          example: "Password123!"
          
    RefreshRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
          
    AuthResponse:
      type: object
      properties:
        access_token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        token_type:
          type: string
          enum: [bearer]
          example: bearer
        expires_in:
          type: integer
          example: 3600
        refresh_token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
          
    UserDto:
      type: object
      properties:
        id:
          type: integer
          example: 1
        keycloak_user_id:
          type: string
          example: "123e4567-e89b-12d3-a456-426614174000"
        email:
          type: string
          example: user@example.com
        enabled:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
          example: "2026-06-03T10:00:00Z"
          
    UserPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/UserDto'
        total_elements:
          type: integer
          example: 100
        total_pages:
          type: integer
          example: 5
        number:
          type: integer
          example: 0
        size:
          type: integer
          example: 20
          
    Error:
      type: object
      properties:
        error:
          type: string
          example: "Invalid credentials"
        message:
          type: string
          example: "Email or password is incorrect"
        timestamp:
          type: string
          format: date-time
          example: "2026-06-03T10:30:00Z"

    WebhookEvent:
      type: object
      required:
        - event
        - timestamp
        - user
      properties:
        event:
          type: string
          enum: [user_created, user_updated, user_enabled, user_disabled, user_deleted]
          description: Type of Keycloak event (snake_case, lowercase)
          example: "user_created"
        timestamp:
          type: string
          format: date-time
          example: "2026-06-14T10:00:00Z"
        user:
          type: object
          properties:
            id:
              type: string
              description: Keycloak user ID
              example: "123e4567-e89b-12d3-a456-426614174000"
            username:
              type: string
              description: Username/email
              example: "user@example.com"
            email:
              type: string
              format: email
              example: "user@example.com"
            enabled:
              type: boolean
              example: true
