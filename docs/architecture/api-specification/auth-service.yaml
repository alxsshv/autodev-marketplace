openapi: 3.0.3
info:
  title: AutoDev Marketplace Auth Service
  version: 1.0.0
  description: Authentication and authorization service

servers:
  - url: http://auth-service:8082
    description: Docker environment
  - url: http://localhost:8082
    description: Local development

paths:
  /api/v1/auth/login:
    post:
      summary: Login user
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many login attempts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
                
  /api/v1/auth/refresh:
    post:
      summary: Refresh access token
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
                
  /api/v1/auth/logout:
    post:
      summary: Logout user
      tags:
        - Authentication
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Successfully logged out
        '401':
          description: Unauthorized
          
  /api/v1/auth/me:
    get:
      summary: Get current user
      tags:
        - Authentication
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        '401':
          description: Unauthorized
          
  /api/v1/auth/verify:
    get:
      summary: Verify token validity
      tags:
        - Authentication
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Token is valid
        '401':
          description: Token is invalid or expired

  /api/v1/auth/users:
    get:
      summary: Get all users (Admin only)
      tags:
        - User Management
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
        - name: role
          in: query
          schema:
            type: string
            enum: [BUYER, SELLER, MODERATOR, ADMIN]
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '403':
          description: Forbidden
          
  /api/v1/auth/users/{userId}:
    get:
      summary: Get user by ID (Admin/Moderator only)
      tags:
        - User Management
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        '404':
          description: User not found
        '403':
          description: Forbidden
          
    put:
      summary: Update user (Admin/Moderator only)
      tags:
        - User Management
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        '404':
          description: User not found
        '403':
          description: Forbidden
          
    delete:
      summary: Delete user (Admin only)
      tags:
        - User Management
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: User deleted
        '404':
          description: User not found
        '403':
          description: Forbidden

  /api/v1/auth/roles:
    get:
      summary: Get all roles (Admin only)
      tags:
        - Role Management
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoleDto'
        '403':
          description: Forbidden
          
    post:
      summary: Create role (Admin only)
      tags:
        - Role Management
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoleRequest'
      responses:
        '201':
          description: Role created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleDto'
        '403':
          description: Forbidden
        '409':
          description: Role already exists

  /api/v1/auth/roles/{roleId}:
    get:
      summary: Get role by ID (Admin only)
      tags:
        - Role Management
      security:
        - bearerAuth: []
      parameters:
        - name: roleId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Role details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleDto'
        '404':
          description: Role not found
        '403':
          description: Forbidden
          
    put:
      summary: Update role (Admin only)
      tags:
        - Role Management
      security:
        - bearerAuth: []
      parameters:
        - name: roleId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoleRequest'
      responses:
        '200':
          description: Role updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleDto'
        '404':
          description: Role not found
        '403':
          description: Forbidden
          
    delete:
      summary: Delete role (Admin only)
      tags:
        - Role Management
      security:
        - bearerAuth: []
      parameters:
        - name: roleId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Role deleted
        '404':
          description: Role not found
        '403':
          description: Forbidden

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          minLength: 8
          example: "Password123!"
          
    RefreshRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
          
    AuthResponse:
      type: object
      properties:
        access_token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        token_type:
          type: string
          enum: [bearer]
          example: bearer
        expires_in:
          type: integer
          example: 3600
        refresh_token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
          
    UserDto:
      type: object
      properties:
        id:
          type: integer
          example: 1
        keycloak_user_id:
          type: string
          example: "123e4567-e89b-12d3-a456-426614174000"
        email:
          type: string
          example: user@example.com
        first_name:
          type: string
          example: John
        last_name:
          type: string
          example: Doe
        phone:
          type: string
          example: "+79001234567"
        role:
          type: string
          enum: [BUYER, SELLER, MODERATOR, ADMIN]
          example: BUYER
        enabled:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
          example: "2026-06-03T10:00:00Z"
          
    UpdateUserRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
        phone:
          type: string
        role:
          type: string
          enum: [BUYER, SELLER, MODERATOR, ADMIN]
        enabled:
          type: boolean
          
    UserPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/UserDto'
        total_elements:
          type: integer
          example: 100
        total_pages:
          type: integer
          example: 5
        number:
          type: integer
          example: 0
        size:
          type: integer
          example: 20
          
    RoleDto:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          enum: [BUYER, SELLER, MODERATOR, ADMIN]
          example: BUYER
        description:
          type: string
          example: "Standard buyer role"
          
    CreateRoleRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          enum: [BUYER, SELLER, MODERATOR, ADMIN]
        description:
          type: string
          
    UpdateRoleRequest:
      type: object
      properties:
        description:
          type: string
          
    Error:
      type: object
      properties:
        error:
          type: string
          example: "Invalid credentials"
        message:
          type: string
          example: "Email or password is incorrect"
        timestamp:
          type: string
          format: date-time
          example: "2026-06-03T10:30:00Z"
