openapi: 3.0.3
info:
  title: AutoDev Marketplace Order Service
  version: 1.0.0
  description: Order management, cart, delivery, tracking

servers:
  - url: http://order-service:8080
    description: Docker environment
  - url: http://localhost:8087
    description: Local development

paths:
  # Cart Endpoints
  /api/v1/orders/cart:
    get:
      summary: Get current user cart
      tags:
        - Cart
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Cart retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartDto'
        '401':
          description: Unauthorized

    post:
      summary: Add item to cart
      tags:
        - Cart
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddToCartRequest'
      responses:
        '201':
          description: Item added to cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartDto'
        '400':
          description: Invalid request
        '401':
          description: Unauthorized

    put:
      summary: Update cart item quantity
      tags:
        - Cart
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCartRequest'
      responses:
        '200':
          description: Cart updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartDto'
        '400':
          description: Invalid request
        '401':
          description: Unauthorized

    delete:
      summary: Remove item from cart
      tags:
        - Cart
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoveFromCartRequest'
      responses:
        '204':
          description: Item removed from cart
        '401':
          description: Unauthorized

  # Order Creation Endpoints
  /api/v1/orders:
    get:
      summary: Get user orders list
      tags:
        - Orders
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, PROCESSING, SHIPPED, DELIVERING, PICKUP_READY, COMPLETED, CANCELLED, RETURNED]
      responses:
        '200':
          description: Orders list retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOrderList'

    post:
      summary: Create new order
      tags:
        - Orders
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDto'
        '400':
          description: Invalid request
        '409':
          description: Insufficient inventory

  /api/v1/orders/{id}:
    get:
      summary: Get order by ID
      tags:
        - Orders
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Order details retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDto'
        '404':
          description: Order not found
        '403':
          description: Not authorized to view this order

  /api/v1/orders/{id}/cancel:
    post:
      summary: Cancel order
      tags:
        - Orders
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Order cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDto'
        '400':
          description: Cannot cancel order in current status
        '403':
          description: Not authorized

  # Delivery Options Endpoints
  /api/v1/orders/delivery-options:
    get:
      summary: Get delivery options
      tags:
        - Delivery
      security:
        - bearerAuth: []
      parameters:
        - name: city
          in: query
          schema:
            type: string
            example: "Москва"
        - name: postcode
          in: query
          schema:
            type: string
            example: "123456"
        - name: weight
          in: query
          schema:
            type: number
            format: double
            example: 5.5
      responses:
        '200':
          description: Delivery options retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeliveryOptionDto'

  /api/v1/orders/delivery-cost:
    get:
      summary: Calculate delivery cost
      tags:
        - Delivery
      security:
        - bearerAuth: []
      parameters:
        - name: deliveryServiceId
          in: query
          schema:
            type: integer
        - name: address
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Delivery cost calculated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryCostDto'

  # Delivery Tracking Endpoints
  /api/v1/orders/{id}/tracking:
    get:
      summary: Get order tracking info
      tags:
        - Tracking
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Tracking info retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackingInfoDto'
        '404':
          description: Order not found

  # Payment Endpoints
  /api/v1/orders/{id}/payment:
    post:
      summary: Initiate payment for order
      tags:
        - Payment
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      responses:
        '200':
          description: Payment initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '400':
          description: Invalid payment method
        '409':
          description: Order already paid or cancelled

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Authorization header using the Bearer scheme. Example: "Authorization: Bearer {token}"

  schemas:
    CartDto:
      type: object
      properties:
        id:
          type: integer
          example: 1
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItemDto'
        totalAmount:
          type: number
          format: double
          example: 7500.00
        itemCount:
          type: integer
          example: 3
        expiresAt:
          type: string
          format: date-time
          example: "2026-06-05T10:00:00Z"

    CartItemDto:
      type: object
      properties:
        id:
          type: integer
          example: 10
        productId:
          type: integer
          example: 123
        productName:
          type: string
          example: "Масло моторное Shell Helix HX8 5W-30"
        productImage:
          type: string
          example: "https://storage.googleapis.com/bucket/product1.jpg"
        quantity:
          type: integer
          example: 2
        unitPrice:
          type: number
          format: double
          example: 2500.00
        totalPrice:
          type: number
          format: double
          example: 5000.00

    AddToCartRequest:
      type: object
      required:
        - productId
        - quantity
      properties:
        productId:
          type: integer
          example: 123
        quantity:
          type: integer
          minimum: 1
          maximum: 100
          example: 2

    UpdateCartRequest:
      type: object
      required:
        - cartItemId
        - quantity
      properties:
        cartItemId:
          type: integer
          example: 10
        quantity:
          type: integer
          minimum: 1
          maximum: 100
          example: 3

    RemoveFromCartRequest:
      type: object
      required:
        - cartItemId
      properties:
        cartItemId:
          type: integer
          example: 10

    OrderDto:
      type: object
      properties:
        id:
          type: integer
          example: 100
        orderNumber:
          type: string
          example: "ORD-2026-06-04-001"
        status:
          type: string
          enum: [PENDING, PROCESSING, SHIPPED, DELIVERING, PICKUP_READY, COMPLETED, CANCELLED, RETURNED]
          example: "PENDING"
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemDto'
        totalAmount:
          type: number
          format: double
          example: 7500.00
        deliveryAddress:
          $ref: '#/components/schemas/DeliveryAddressDto'
        deliveryOption:
          $ref: '#/components/schemas/DeliveryOptionDto'
        paymentMethod:
          type: string
          enum: [ONLINE_CARD, ONLINE_TINKOFF, CASH, BANK_TRANSFER]
          example: "ONLINE_CARD"
        escrowStatus:
          type: string
          enum: [HELD, RELEASED, RETURNED]
          example: "HELD"
        createdAt:
          type: string
          format: date-time
          example: "2026-06-04T10:00:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-06-04T11:30:00Z"

    OrderItemDto:
      type: object
      properties:
        id:
          type: integer
          example: 200
        productId:
          type: integer
          example: 123
        productName:
          type: string
          example: "Масло моторное Shell Helix HX8 5W-30"
        quantity:
          type: integer
          example: 2
        unitPrice:
          type: number
          format: double
          example: 2500.00
        totalPrice:
          type: number
          format: double
          example: 5000.00

    CreateOrderRequest:
      type: object
      required:
        - items
        - deliveryAddress
        - deliveryOptionId
        - paymentMethod
      properties:
        items:
          type: array
          items:
            type: object
            required:
              - productId
              - quantity
            properties:
              productId:
                type: integer
                example: 123
              quantity:
                type: integer
                example: 2
        deliveryAddress:
          $ref: '#/components/schemas/DeliveryAddressDto'
        deliveryOptionId:
          type: integer
          example: 1
        paymentMethod:
          type: string
          enum: [ONLINE_CARD, ONLINE_TINKOFF, CASH, BANK_TRANSFER]
          example: "ONLINE_CARD"
        comment:
          type: string
          maxLength: 500

    DeliveryAddressDto:
      type: object
      required:
        - city
        - address
        - postcode
      properties:
        city:
          type: string
          example: "Москва"
        address:
          type: string
          example: "ул. Ленина, д. 15, кв. 100"
        postcode:
          type: string
          example: "123456"
        contactPerson:
          type: string
          example: "Иванов Иван"
        phone:
          type: string
          example: "+79001234567"

    DeliveryOptionDto:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "СДЭК Курьер"
        description:
          type: string
          example: "Доставка курьером по Москве"
        price:
          type: number
          format: double
          example: 350.00
        deliveryTimeMin:
          type: integer
          example: 1
        deliveryTimeMax:
          type: integer
          example: 3
        carrier:
          type: string
          example: "СДЭК"

    DeliveryCostDto:
      type: object
      properties:
        deliveryOptionId:
          type: integer
          example: 1
        name:
          type: string
          example: "СДЭК Курьер"
        price:
          type: number
          format: double
          example: 350.00
        currency:
          type: string
          example: "RUB"
        estimatedDeliveryDays:
          type: integer
          example: 2

    TrackingInfoDto:
      type: object
      properties:
        orderId:
          type: integer
          example: 100
        orderNumber:
          type: string
          example: "ORD-2026-06-04-001"
        status:
          type: string
          enum: [PENDING, PROCESSING, SHIPPED, DELIVERING, PICKUP_READY, COMPLETED, CANCELLED, RETURNED]
          example: "DELIVERING"
        carrier:
          type: string
          example: "СДЭК"
        trackingNumber:
          type: string
          example: "CE123456789RU"
        currentLocation:
          type: string
          example: "Москва, склад СДЭК"
        estimatedDelivery:
          type: string
          format: date
          example: "2026-06-07"
        history:
          type: array
          items:
            $ref: '#/components/schemas/TrackingEventDto'

    TrackingEventDto:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
          example: "2026-06-05T14:30:00Z"
        status:
          type: string
          example: "Arrival at sorting center"
        location:
          type: string
          example: "Москва"
        description:
          type: string
          example: "Посылка прибыла на сортировочный центр"

    PaymentRequest:
      type: object
      required:
        - paymentMethod
      properties:
        paymentMethod:
          type: string
          enum: [ONLINE_CARD, ONLINE_TINKOFF, CASH, BANK_TRANSFER]
          example: "ONLINE_CARD"

    PaymentResponse:
      type: object
      properties:
        orderId:
          type: integer
          example: 100
        paymentId:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        paymentUrl:
          type: string
          example: "https://payment.tinkoff.ru/... "
        status:
          type: string
          enum: [PENDING, SUCCESS, FAILED]
          example: "PENDING"

    PaginatedOrderList:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/OrderDto'
        totalElements:
          type: integer
          example: 50
        totalPages:
          type: integer
          example: 3
        number:
          type: integer
          example: 0
        size:
          type: integer
          example: 20
