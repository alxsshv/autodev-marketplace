openapi: 3.0.3
info:
  title: AutoDev Marketplace Search Service
  version: 1.0.0
  description: Full-text search, filtering, autocomplete, recommendations

servers:
  - url: http://search-service:8080
    description: Docker environment
  - url: http://localhost:8086
    description: Local development

paths:
  # Search Endpoints
  /api/v1/search/products:
    get:
      summary: Search products
      tags:
        - Search
      parameters:
        - name: query
          in: query
          schema:
            type: string
            description: Search query
            example: "BMW F20 масло"
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
        - name: categoryId
          in: query
          schema:
            type: integer
        - name: brandId
          in: query
          schema:
            type: integer
        - name: minPrice
          in: query
          schema:
            type: number
            format: double
        - name: maxPrice
          in: query
          schema:
            type: number
            format: double
        - name: condition
          in: query
          schema:
            type: string
            enum: [NEW, USED]
        - name: vin
          in: query
          schema:
            type: string
            maxLength: 17
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [RELEVANCE, PRICE_ASC, PRICE_DESC, RATING, NEWEST]
            default: RELEVANCE
        - name: sellerRatingMin
          in: query
          schema:
            type: number
            format: float
            minimum: 0
            maximum: 5
        - name: inStock
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResult'

  # Autocomplete Endpoints
  /api/v1/search/autocomplete:
    get:
      summary: Get autocomplete suggestions
      tags:
        - Autocomplete
      parameters:
        - name: query
          in: query
          schema:
            type: string
            example: "BMW"
        - name: limit
          in: query
          schema:
            type: integer
            default: 5
      responses:
        '200':
          description: Autocomplete suggestions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutocompleteResponse'

  # Filter Suggestions Endpoints
  /api/v1/search/filters/suggestions:
    get:
      summary: Get filter suggestions based on search
      tags:
        - Filters
      parameters:
        - name: query
          in: query
          schema:
            type: string
            example: "масло"
        - name: categoryId
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Filter suggestions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilterSuggestions'

  # Recommendation Endpoints
  /api/v1/search/recommendations:
    get:
      summary: Get product recommendations
      tags:
        - Recommendations
      security:
        - bearerAuth: []
      parameters:
        - name: productId
          in: query
          schema:
            type: integer
            description: Product ID for similar products
        - name: type
          in: query
          schema:
            type: string
            enum: [SIMILAR, CUSTOMERS_ALSO_BOUGHT, FREQUENTLY_BOUGHT_TOGETHER]
            default: SIMILAR
        - name: limit
          in: query
          schema:
            type: integer
            default: 5
      responses:
        '200':
          description: Recommendations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecommendationDto'

  # Search History Endpoints
  /api/v1/search/history:
    get:
      summary: Get search history (Personalized)
      tags:
        - Search History
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Search history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSearchHistory'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Authorization header using the Bearer scheme. Example: "Authorization: Bearer {token}"

  schemas:
    SearchResult:
      type: object
      properties:
        query:
          type: string
          example: "BMW F20 масло"
        totalResults:
          type: integer
          example: 150
        page:
          type: integer
          example: 0
        size:
          type: integer
          example: 20
        products:
          type: array
          items:
            $ref: '#/components/schemas/ProductHit'
        facets:
          $ref: '#/components/schemas/Facets'

    ProductHit:
      type: object
      properties:
        id:
          type: integer
          example: 123
        sku:
          type: string
          example: "ABC123456"
        name:
          type: string
          example: "Масло моторное Shell Helix HX8 5W-30"
        description:
          type: string
          example: "Высококачественное синтетическое моторное масло..."
        price:
          type: number
          format: double
          example: 2500.00
        currency:
          type: string
          example: "RUB"
        condition:
          type: string
          enum: [NEW, USED]
          example: "NEW"
        brand:
          $ref: '#/components/schemas/BrandDto'
        category:
          $ref: '#/components/schemas/CategoryDto'
        seller:
          $ref: '#/components/schemas/SellerInfoDto'
        images:
          type: array
          items:
            type: string
          example: ["https://storage.googleapis.com/bucket/product1.jpg"]
        score:
          type: number
          format: double
          example: 85.5
        matchType:
          type: string
          enum: [FULL_MATCH, PARTIAL_MATCH, FUZZY_MATCH]
          example: "FULL_MATCH"

    BrandDto:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Shell"

    CategoryDto:
      type: object
      properties:
        id:
          type: integer
          example: 5
        name:
          type: string
          example: "Масла"
        parentId:
          type: integer
          example: 2

    SellerInfoDto:
      type: object
      properties:
        id:
          type: integer
          example: 10
        name:
          type: string
          example: "AutoParts Shop"
        rating:
          type: number
          format: float
          example: 4.5
        verified:
          type: boolean
          example: true

    Facets:
      type: object
      properties:
        categories:
          type: array
          items:
            $ref: '#/components/schemas/FacetItem'
        brands:
          type: array
          items:
            $ref: '#/components/schemas/FacetItem'
        priceRanges:
          type: array
          items:
            $ref: '#/components/schemas/PriceRangeFacet'
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/FacetItem'

    FacetItem:
      type: object
      properties:
        id:
          type: integer
          example: 5
        name:
          type: string
          example: "Масла"
        count:
          type: integer
          example: 50

    PriceRangeFacet:
      type: object
      properties:
        range:
          type: string
          example: "1000-2000"
        min:
          type: number
          format: double
          example: 1000.00
        max:
          type: number
          format: double
          example: 2000.00
        count:
          type: integer
          example: 25

    AutocompleteResponse:
      type: object
      properties:
        query:
          type: string
          example: "BMW"
        suggestions:
          type: array
          items:
            $ref: '#/components/schemas/AutocompleteSuggestion'
        products:
          type: array
          items:
            $ref: '#/components/schemas/ProductHit'
        categories:
          type: array
          items:
            $ref: '#/components/schemas/CategoryDto'
        brands:
          type: array
          items:
            $ref: '#/components/schemas/BrandDto'

    AutocompleteSuggestion:
      type: object
      properties:
        text:
          type: string
          example: "BMW F20"
        type:
          type: string
          enum: [QUERY, PRODUCT, CATEGORY, BRAND]
          example: "QUERY"
        highlightedText:
          type: string
          example: "<b>BMW</b> F20"
        score:
          type: number
          format: double
          example: 95.0

    FilterSuggestions:
      type: object
      properties:
        query:
          type: string
          example: "масло"
        categories:
          type: array
          items:
            $ref: '#/components/schemas/CategoryDto'
        brands:
          type: array
          items:
            $ref: '#/components/schemas/BrandDto'
        priceRange:
          type: object
          properties:
            min:
              type: number
              format: double
              example: 100.00
            max:
              type: number
              format: double
              example: 5000.00

    RecommendationDto:
      type: object
      properties:
        productId:
          type: integer
          example: 456
        productName:
          type: string
          example: "Масло моторное Mobil 1 5W-40"
        productImage:
          type: string
          example: "https://storage.googleapis.com/bucket/product2.jpg"
        productPrice:
          type: number
          format: double
          example: 2800.00
        reason:
          type: string
          example: "Similar product to selected item"
        confidenceScore:
          type: number
          format: double
          example: 85.5

    SearchHistoryItemDto:
      type: object
      properties:
        id:
          type: integer
          example: 200
        query:
          type: string
          example: "BMW F20"
        resultsCount:
          type: integer
          example: 15
        clickedProductId:
          type: integer
          example: 123
        clickedProductName:
          type: string
          example: "Масло моторное Shell Helix HX8 5W-30"
        createdAt:
          type: string
          format: date-time
          example: "2026-06-04T10:00:00Z"

    PaginatedSearchHistory:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/SearchHistoryItemDto'
        totalElements:
          type: integer
          example: 100
        totalPages:
          type: integer
          example: 5
        number:
          type: integer
          example: 0
        size:
          type: integer
          example: 20
