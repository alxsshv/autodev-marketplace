openapi: 3.0.3
info:
  title: AutoDev Marketplace Payment Service
  version: 1.0.0
  description: Payment processing, escrow management, payment methods

servers:
  - url: http://payment-service:8080
    description: Docker environment
  - url: http://localhost:8094
    description: Local development

paths:
  # Payment Processing Endpoints
  /api/v1/payments/pay:
    post:
      summary: Process payment
      tags:
        - Payment Processing
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      responses:
        '200':
          description: Payment initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '400':
          description: Invalid request
        '409':
          description: Order already paid or cancelled
        '503':
          description: Payment gateway unavailable

  /api/v1/payments/{paymentId}:
    get:
      summary: Get payment status
      tags:
        - Payment Processing
      security:
        - bearerAuth: []
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Payment details retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentDto'
        '404':
          description: Payment not found
        '403':
          description: Not authorized

  # Escrow Endpoints
  /api/v1/payments/escrow:
    post:
      summary: Create escrow transaction
      tags:
        - Escrow
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EscrowRequest'
      responses:
        '201':
          description: Escrow created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EscrowResponse'
        '400':
          description: Invalid request
        '409':
          description: Escrow already exists

  /api/v1/payments/escrow/{escrowId}/release:
    post:
      summary: Release escrow funds to seller
      tags:
        - Escrow
      security:
        - bearerAuth: []
      parameters:
        - name: escrowId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Escrow released
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EscrowDto'
        '400':
          description: Cannot release escrow
        '404':
          description: Escrow not found

  /api/v1/payments/escrow/{escrowId}/return:
    post:
      summary: Return escrow funds to buyer
      tags:
        - Escrow
      security:
        - bearerAuth: []
      parameters:
        - name: escrowId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReturnRequest'
      responses:
        '200':
          description: Escrow returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EscrowDto'
        '400':
          description: Cannot return escrow
        '404':
          description: Escrow not found

  # Payment Methods Endpoints
  /api/v1/payments/methods:
    get:
      summary: Get available payment methods
      tags:
        - Payment Methods
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Payment methods retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaymentMethodDto'

  /api/v1/payments/methods/{methodId}:
    get:
      summary: Get payment method details
      tags:
        - Payment Methods
      security:
        - bearerAuth: []
      parameters:
        - name: methodId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Payment method details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethodDto'
        '404':
          description: Payment method not found

  # Payment History Endpoints
  /api/v1/payments/history:
    get:
      summary: Get payment history
      tags:
        - Payment History
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
        - name: startDate
          in: query
          schema:
            type: string
            format: date-time
        - name: endDate
          in: query
          schema:
            type: string
            format: date-time
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, SUCCESS, FAILED, REFUNDED]
      responses:
        '200':
          description: Payment history retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPaymentHistory'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Authorization header using the Bearer scheme. Example: "Authorization: Bearer {token}"

  schemas:
    PaymentRequest:
      type: object
      required:
        - orderId
        - amount
        - currency
        - paymentMethod
      properties:
        orderId:
          type: integer
          example: 100
        amount:
          type: number
          format: double
          minimum: 0.01
          example: 7500.00
        currency:
          type: string
          example: "RUB"
        paymentMethod:
          type: string
          enum: [ONLINE_CARD, ONLINE_TINKOFF, CASH, BANK_TRANSFER]
          example: "ONLINE_CARD"
        description:
          type: string
          example: "Payment for order #ORD-2026-06-04-001"
        returnUrl:
          type: string
          example: "https://autodev.marketplace/payment/result"
        failUrl:
          type: string
          example: "https://autodev.marketplace/payment/fail"

    PaymentResponse:
      type: object
      properties:
        paymentId:
          type: integer
          example: 50
        orderId:
          type: integer
          example: 100
        paymentMethod:
          type: string
          enum: [ONLINE_CARD, ONLINE_TINKOFF, CASH, BANK_TRANSFER]
          example: "ONLINE_CARD"
        amount:
          type: number
          format: double
          example: 7500.00
        currency:
          type: string
          example: "RUB"
        status:
          type: string
          enum: [PENDING, SUCCESS, FAILED, REFUNDED]
          example: "PENDING"
        paymentUrl:
          type: string
          example: "https://payment.tinkoff.ru/... "
        transactionId:
          type: string
          example: "txn_1234567890"
        createdAt:
          type: string
          format: date-time
          example: "2026-06-04T10:00:00Z"

    PaymentDto:
      type: object
      properties:
        id:
          type: integer
          example: 50
        orderId:
          type: integer
          example: 100
        orderNumber:
          type: string
          example: "ORD-2026-06-04-001"
        amount:
          type: number
          format: double
          example: 7500.00
        currency:
          type: string
          example: "RUB"
        paymentMethod:
          type: string
          enum: [ONLINE_CARD, ONLINE_TINKOFF, CASH, BANK_TRANSFER]
          example: "ONLINE_CARD"
        status:
          type: string
          enum: [PENDING, SUCCESS, FAILED, REFUNDED]
          example: "SUCCESS"
        transactionId:
          type: string
          example: "txn_1234567890"
        escrowId:
          type: integer
          example: 25
       escrowStatus:
          type: string
          enum: [HELD, RELEASED, RETURNED]
          example: "RELEASED"
        paymentGateway:
          type: string
          enum: [SBERBANK, TINKOFF, CASH, BANK_TRANSFER]
          example: "TINKOFF"
        createdAt:
          type: string
          format: date-time
          example: "2026-06-04T10:00:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-06-04T10:05:00Z"

    EscrowRequest:
      type: object
      required:
        - orderId
        - amount
        - currency
        - sellerId
      properties:
        orderId:
          type: integer
          example: 100
        amount:
          type: number
          format: double
          minimum: 0.01
          example: 7500.00
        currency:
          type: string
          example: "RUB"
        sellerId:
          type: integer
          example: 10
        buyerId:
          type: integer
          example: 5
        releaseConditions:
          type: object
          properties:
            releaseOnDelivery:
              type: boolean
              example: true
            holdDays:
              type: integer
              example: 7

    EscrowResponse:
      type: object
      properties:
        escrowId:
          type: integer
          example: 25
        orderId:
          type: integer
          example: 100
        amount:
          type: number
          format: double
          example: 7500.00
        currency:
          type: string
          example: "RUB"
        status:
          type: string
          enum: [HELD, RELEASED, RETURNED]
          example: "HELD"
        sellerId:
          type: integer
          example: 10
        buyerId:
          type: integer
          example: 5
        createdAt:
          type: string
          format: date-time
          example: "2026-06-04T10:00:00Z"
        releasedAt:
          type: string
          format: date-time
          example: "2026-06-07T10:00:00Z"

    EscrowDto:
      type: object
      properties:
        id:
          type: integer
          example: 25
        orderId:
          type: integer
          example: 100
        orderNumber:
          type: string
          example: "ORD-2026-06-04-001"
        amount:
          type: number
          format: double
          example: 7500.00
        currency:
          type: string
          example: "RUB"
        status:
          type: string
          enum: [HELD, RELEASED, RETURNED]
          example: "RELEASED"
        sellerId:
          type: integer
          example: 10
        sellerPayout:
          type: number
          format: double
          example: 7000.00
        platformFee:
          type: number
          format: double
          example: 500.00
        buyerId:
          type: integer
          example: 5
        releaseReason:
          type: string
          enum: [DELIVERED, CONFIRMED, AUTO_RELEASE]
          example: "DELIVERED"
        createdAt:
          type: string
          format: date-time
          example: "2026-06-04T10:00:00Z"
        releasedAt:
          type: string
          format: date-time
          example: "2026-06-07T10:00:00Z"

    ReturnRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          enum: [ buyer_request, product_not_as_described, product_not_delivered, other ]
          example: "buyer_request"
        description:
          type: string
          example: "Product arrived damaged"

    PaymentMethodDto:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Карта онлайн"
        code:
          type: string
          enum: [ONLINE_CARD, ONLINE_TINKOFF, CASH, BANK_TRANSFER]
          example: "ONLINE_CARD"
        description:
          type: string
          example: "Оплата банковской картой через Tinkoff"
        enabled:
          type: boolean
          example: true
        feePercent:
          type: number
          format: double
          example: 2.5
        minAmount:
          type: number
          format: double
          example: 1.00
        maxAmount:
          type: number
          format: double
          example: 100000.00

    PaginatedPaymentHistory:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/PaymentDto'
        totalElements:
          type: integer
          example: 100
        totalPages:
          type: integer
          example: 5
        number:
          type: integer
          example: 0
        size:
          type: integer
          example: 20
