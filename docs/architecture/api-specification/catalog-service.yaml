openapi: 3.0.3
info:
  title: AutoDev Marketplace Catalog Service
  version: 1.0.0
  description: Product catalog management, category structure, VIN lookup, cross-references

servers:
  - url: http://catalog-service:8080
    description: Docker environment
  - url: http://localhost:8084
    description: Local development

paths:
  # Product Endpoints
  /api/v1/catalog/products:
    get:
      summary: Get products list with filters
      tags:
        - Products
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
        - name: search
          in: query
          schema:
            type: string
            description: Search by name, SKU, or VIN
        - name: categoryId
          in: query
          schema:
            type: integer
            description: Filter by category ID
        - name: brandId
          in: query
          schema:
            type: integer
            description: Filter by brand ID
        - name: minPrice
          in: query
          schema:
            type: number
            format: double
            description: Minimum price
        - name: maxPrice
          in: query
          schema:
            type: number
            format: double
            description: Maximum price
        - name: condition
          in: query
          schema:
            type: string
            enum: [NEW, USED]
            description: Product condition
        - name: vin
          in: query
          schema:
            type: string
            maxLength: 17
            description: Filter by compatible VIN
        - name: sellerRatingMin
          in: query
          schema:
            type: number
            format: float
            minimum: 0
            maximum: 5
            description: Minimum seller rating
        - name: deliveryTimeMin
          in: query
          schema:
            type: integer
            description: Minimum delivery time in days
        - name: inStock
          in: query
          schema:
            type: boolean
            description: Filter by availability
      responses:
        '200':
          description: Products list retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProductList'

  /api/v1/catalog/products/{id}:
    get:
      summary: Get product by ID
      tags:
        - Products
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Product details retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDto'
        '404':
          description: Product not found

  /api/v1/catalog/products/{id}/alternatives:
    get:
      summary: Get alternative products for given product
      tags:
        - Products
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Alternatives list retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProductList'
        '404':
          description: Product not found

  # VIN Lookup Endpoints
  /api/v1/catalog/vin/{vin}/products:
    get:
      summary: Get compatible products for VIN
      tags:
        - VIN Lookup
      parameters:
        - name: vin
          in: path
          required: true
          schema:
            type: string
            maxLength: 17
            example: "WBAxxxxx00xxxxxxx"
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
        - name: category
          in: query
          schema:
            type: string
            description: Filter by category name
      responses:
        '200':
          description: Compatible products retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VINLookupResult'
        '400':
          description: Invalid VIN format
        '404':
          description: No products found for VIN

  /api/v1/catalog/vin/{vin}/vehicle:
    get:
      summary: Get vehicle info by VIN
      tags:
        - VIN Lookup
      parameters:
        - name: vin
          in: path
          required: true
          schema:
            type: string
            maxLength: 17
      responses:
        '200':
          description: Vehicle info retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleInfoDto'
        '400':
          description: Invalid VIN format
        '404':
          description: Vehicle not found

  # Category Endpoints
  /api/v1/catalog/categories:
    get:
      summary: Get all categories tree
      tags:
        - Categories
      responses:
        '200':
          description: Categories tree retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryTree'

  /api/v1/catalog/categories/{id}:
    get:
      summary: Get category by ID
      tags:
        - Categories
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Category details retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryDto'
        '404':
          description: Category not found

  # Brand Endpoints
  /api/v1/catalog/brands:
    get:
      summary: Get all brands
      tags:
        - Brands
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Brands list retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBrandList'

  /api/v1/catalog/brands/{id}:
    get:
      summary: Get brand by ID
      tags:
        - Brands
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Brand details retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandDto'
        '404':
          description: Brand not found

  # Cross Reference Endpoints
  /api/v1/catalog/products/{id}/cross-references:
    get:
      summary: Get cross-references for product
      tags:
        - Cross References
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Cross-references retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CrossReferenceDto'
        '404':
          description: Product not found

components:
  schemas:
    ProductDto:
      type: object
      properties:
        id:
          type: integer
          example: 123
        sku:
          type: string
          example: "ABC123456"
        name:
          type: string
          example: "Масло моторное Shell Helix HX8 5W-30"
        description:
          type: string
          example: "Высококачественное синтетическое моторное масло..."
        brand:
          $ref: '#/components/schemas/BrandDto'
        category:
          $ref: '#/components/schemas/CategoryDto'
        price:
          type: number
          format: double
          example: 2500.00
        currency:
          type: string
          example: "RUB"
        condition:
          type: string
          enum: [NEW, USED]
          example: "NEW"
        vinCompatibility:
          type: array
          items:
            $ref: '#/components/schemas/VINCompatibilityDto'
        seller:
          $ref: '#/components/schemas/SellerInfoDto'
        images:
          type: array
          items:
            type: string
          example: ["https://storage.googleapis.com/bucket/product1.jpg"]
        specifications:
          type: object
          example:
            viscosity: "5W-30"
            certification: "API SN"
        createdAt:
          type: string
          format: date-time
          example: "2026-06-04T10:00:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-06-04T11:30:00Z"

    BrandDto:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Shell"
        logoUrl:
          type: string
          example: "https://storage.googleapis.com/bucket/shell-logo.png"

    CategoryDto:
      type: object
      properties:
        id:
          type: integer
          example: 5
        name:
          type: string
          example: "Масла"
        parentId:
          type: integer
          example: 2
        level:
          type: integer
          example: 2

    SellerInfoDto:
      type: object
      properties:
        id:
          type: integer
          example: 10
        name:
          type: string
          example: "AutoParts Shop"
        rating:
          type: number
          format: float
          example: 4.5
        verified:
          type: boolean
          example: true
        location:
          type: string
          example: "Москва"

    VINCompatibilityDto:
      type: object
      properties:
        vin:
          type: string
          example: "WBAxxxxx00xxxxxxx"
        vehicleName:
          type: string
          example: "BMW F20 2015-2020"
        manufacturer:
          type: string
          example: "BMW"
        model:
          type: string
          example: "F20"
        year:
          type: integer
          example: 2015

    PaginatedProductList:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ProductDto'
        totalElements:
          type: integer
          example: 100
        totalPages:
          type: integer
          example: 5
        number:
          type: integer
          example: 0
        size:
          type: integer
          example: 20

    VINLookupResult:
      type: object
      properties:
        vin:
          type: string
          example: "WBAxxxxx00xxxxxxx"
        vehicle:
          $ref: '#/components/schemas/VehicleInfoDto'
        products:
          $ref: '#/components/schemas/PaginatedProductList'
        partsCount:
          type: integer
          example: 150

    VehicleInfoDto:
      type: object
      properties:
        vin:
          type: string
          example: "WBAxxxxx00xxxxxxx"
        manufacturer:
          type: string
          example: "BMW"
        model:
          type: string
          example: "F20"
        generation:
          type: string
          example: "LCI"
        bodyType:
          type: string
          example: "Hatchback"
        engine:
          type: string
          example: "B48B20A"
        yearFrom:
          type: integer
          example: 2015
        yearTo:
          type: integer
          example: 2020

    CategoryTree:
      type: object
      properties:
        rootCategories:
          type: array
          items:
            $ref: '#/components/schemas/CategoryDto'
        children:
          type: array
          items:
            $ref: '#/components/schemas/CategoryTree'

    PaginatedBrandList:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/BrandDto'
        totalElements:
          type: integer
          example: 50
        totalPages:
          type: integer
          example: 3
        number:
          type: integer
          example: 0
        size:
          type: integer
          example: 20

    CrossReferenceDto:
      type: object
      properties:
        id:
          type: integer
          example: 1
        originalSku:
          type: string
          example: "ABC123"
        crossSku:
          type: string
          example: "XYZ789"
        manufacturer:
          type: string
          example: "Bosch"
        compatibility:
          type: string
          example: "Direct replacement"
