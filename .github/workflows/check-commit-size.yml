name: Check commit size

on:
  pull_request:
    branches: [ main ]   # или master, develop — подставьте нужную ветку

jobs:
  check-size:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # загружаем всю историю, чтобы увидеть base-ветку

      - name: Calculate changed lines and verify limit
        run: |
          # Получаем суммарное количество добавленных и удалённых строк
          TOTAL=$(git diff --numstat origin/${{ github.base_ref }}...${{ github.sha }} | \
                  awk '{ added += $1; deleted += $2 } END { print added + deleted }')
          # Если diff пустой (например, PR без изменений), TOTAL будет пустым — заменим на 0
          TOTAL=${TOTAL:-0}

          echo "Changed lines: $TOTAL"
          if [ "$TOTAL" -gt 800 ]; then
            echo "❌ Commit size exceeds 800 lines (actual: $TOTAL). Please split into smaller changes."
            exit 1
          else
            echo "✅ Commit size is within the limit."
          fi
