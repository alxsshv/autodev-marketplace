name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  # ============================================
  # JOB 1: Определяем, какие сервисы изменились
  # ============================================
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      # Этот output будет содержать JSON: ["api-gateway"] или ["api-gateway","service-b"]
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # === paths-filter ===
      - name: Detect changed services
        uses: dorny/paths-filter@v3
        id: filter
        with:
          # Для PR сравнивает с base-веткой (develop), для push — с предыдущим коммитом
          filters: |
            api-gateway:
              - 'services/api-gateway/**'
              - 'services/shared-lib/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle/**'
              - 'gradlew'
            catalog-service:
              - 'services/catalog-service/**'
              - 'services/shared-lib/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle/**'
              - 'gradlew'
            communication-service:
              - 'services/communication-service/**'
              - 'services/shared-lib/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle/**'
              - 'gradlew'
            notification-service:
              - 'services/notification-service/**'
              - 'services/shared-lib/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle/**'
              - 'gradlew'
            order-service:
              - 'services/order-service/**'
              - 'services/shared-lib/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle/**'
              - 'gradlew'
            payment-service:
              - 'services/payment-service/**'
              - 'services/shared-lib/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle/**'
              - 'gradlew'
            platform-service:
              - 'services/platform-service/**'
              - 'services/shared-lib/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle/**'
              - 'gradlew'
            listing-service:
              - 'services/listing-service/**'
              - 'services/shared-lib/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle/**'
              - 'gradlew'
            # Добавьте остальные сервисы по аналогии
            # НЕ включайте сюда чисто библиотечные модули без Dockerfile

  # ============================================
  # JOB 2: Unit + Quality (только для изменённых)
  # ============================================
  quality-and-unit-tests:
    needs: detect-changes
    # Если ничего не изменилось (пустой массив) — пропускаем
    if: ${{ needs.detect-changes.outputs.services != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # fromJSON превращает строку '["api-gateway"]' в массив для matrix
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.PAT_TOKEN }}

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - run: chmod +x gradlew

      # Запускаем только для конкретного сервиса из matrix
      - name: Checkstyle
        run: ./gradlew :services:${{ matrix.service }}:checkstyleMain :services:${{ matrix.service }}:checkstyleTest

      - name: SpotBugs
        run: ./gradlew :services:${{ matrix.service }}:spotbugsMain :services:${{ matrix.service }}:spotbugsTest

      - name: Unit tests + Coverage
        run: ./gradlew :services:${{ matrix.service }}:test :services:${{ matrix.service }}:jacocoTestReport

      - name: Verify coverage
        run: ./gradlew :services:${{ matrix.service }}:jacocoTestCoverageVerification

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-reports
          path: |
            services/${{ matrix.service }}/build/reports/

  # ============================================
  # JOB 3: SECURITY GATE — OWASP Dependency Check
  # ============================================
  security-scan:
    needs: detect-changes
    if: needs.detect-changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.PAT_TOKEN }}

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      # OWASP кэширует базу CVE локально — кэшируем между запусками
      - name: Cache OWASP database
        uses: actions/cache@v4
        with:
          path: ~/.gradle/dependency-check-data
          key: ${{ runner.os }}-owasp-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-owasp-

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      - run: chmod +x gradlew

      # Запускаем сканирование зависимостей
      - name: OWASP Dependency Check
        run: ./gradlew :services:${{ matrix.service }}:dependencyCheckAnalyze --no-daemon

      # Публикуем отчёт в Security tab (опционально, требует permissions)
      - name: Upload OWASP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-dependency-check-report
          path: services/${{ matrix.service }}/build/reports/dependency-check-report.html



  # ============================================
  # JOB 4: Integration tests (только на push в develop)
  # ============================================
  integration-tests:
    needs: [detect-changes, quality-and-unit-tests]
    if: github.event_name == 'push' && needs.detect-changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
      - run: chmod +x gradlew
      - uses: docker/setup-buildx-action@v3
      - name: Integration tests
        run: ./gradlew :services:${{ matrix.service }}:integrationTest
        timeout-minutes: 15
      - name: Upload integration reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-integration-reports
          path: services/${{ matrix.service }}/build/reports/tests/integrationTest/

  # ============================================
  # JOB 5: Агрегатор для Branch Protection
  # Имеет фиксированное имя "CI Passed" — его и будем требовать в Rules
  # ============================================
  ci-passed:
    name: CI Passed
    needs: [detect-changes, quality-and-unit-tests, security-scan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify CI results
        run: |
          DETECT="${{ needs.detect-changes.result }}"
          QUALITY="${{ needs.quality-and-unit-tests.result }}"
          SECURITY="${{ needs.security-scan.result }}"

          echo "detect-changes: $DETECT"
          echo "quality-and-unit-tests: $QUALITY"
          echo "security-scan: $SECURITY"

          # detect-changes должен отработать успешно всегда
          if [ "$DETECT" != "success" ]; then
            echo "::error::Job 'detect-changes' failed or was cancelled"
            exit 1
          fi

          # quality и security: либо success (были изменения), либо skipped (не было изменений)
          if [ "$QUALITY" != "success" ] && [ "$QUALITY" != "skipped" ]; then
            echo "::error::Quality and unit tests failed"
            exit 1
          fi

          if [ "$SECURITY" != "success" ] && [ "$SECURITY" != "skipped" ]; then
            echo "::error::Security scan failed"
            exit 1
          fi

          echo "All required checks passed"
