name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  # ============================================
  # JOB 1: Определяем, какие сервисы изменились
  # ============================================
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      # Этот output будет содержать JSON: ["api-gateway"] или ["api-gateway","service-b"]
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # === paths-filter ===
      - name: Detect changed services
        uses: dorny/paths-filter@v3
        id: filter
        with:
          # Для PR сравнивает с base-веткой (develop), для push — с предыдущим коммитом
          filters: |
            api-gateway:
              - 'services/api-gateway/**'
              - 'services/shared-lib/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle/**'
              - 'gradlew'
            catalog-service:
              - 'services/catalog-service/**'
              - 'services/shared-lib/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle/**'
              - 'gradlew'
            communication-service:
              - 'services/communication-service/**'
              - 'services/shared-lib/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle/**'
              - 'gradlew'
            notification-service:
              - 'services/notification-service/**'
              - 'services/shared-lib/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle/**'
              - 'gradlew'
            order-service:
              - 'services/order-service/**'
              - 'services/shared-lib/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle/**'
              - 'gradlew'
            payment-service:
              - 'services/payment-service/**'
              - 'services/shared-lib/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle/**'
              - 'gradlew'
            platform-service:
              - 'services/platform-service/**'
              - 'services/shared-lib/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle/**'
              - 'gradlew'
            # Добавьте остальные сервисы по аналогии
            # НЕ включайте сюда чисто библиотечные модули без Dockerfile

  # ============================================
  # JOB 2: Unit + Quality (только для изменённых)
  # ============================================
  quality-and-unit-tests:
    needs: detect-changes
    # Если ничего не изменилось (пустой массив) — пропускаем
    if: ${{ needs.detect-changes.outputs.services != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # fromJSON превращает строку '["api-gateway"]' в массив для matrix
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.PAT_TOKEN }}

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - run: chmod +x gradlew

      # Запускаем только для конкретного сервиса из matrix
      - name: Checkstyle
        run: ./gradlew :services:${{ matrix.service }}:checkstyleMain :services:${{ matrix.service }}:checkstyleTest

      - name: SpotBugs
        run: ./gradlew :services:${{ matrix.service }}:spotbugsMain :services:${{ matrix.service }}:spotbugsTest

      - name: Unit tests + Coverage
        run: ./gradlew :services:${{ matrix.service }}:test :services:${{ matrix.service }}:jacocoTestReport

      - name: Verify coverage
        run: ./gradlew :services:${{ matrix.service }}:jacocoTestCoverageVerification

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-reports
          path: |
            services/${{ matrix.service }}/build/reports/

  # ============================================
  # JOB 3: Integration tests (только на push в develop)
  # ============================================
  integration-tests:
    needs: [detect-changes, quality-and-unit-tests]
    if: github.event_name == 'push' && needs.detect-changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
      - run: chmod +x gradlew
      - uses: docker/setup-buildx-action@v3
      - name: Integration tests
        run: ./gradlew :services:${{ matrix.service }}:integrationTest
        timeout-minutes: 15
      - name: Upload integration reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-integration-reports
          path: services/${{ matrix.service }}/build/reports/tests/integrationTest/