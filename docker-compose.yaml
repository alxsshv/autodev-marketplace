services:

#  # API Gateway
#  api-gateway:
#    build: ./services/api-gateway
#    container_name: api-gateway
#    ports:
#      - "8081:8080"
#    environment:
#      - SPRING_PROFILES_ACTIVE=docker
#    depends_on:
#      keycloak:
#        condition: service_started
#    restart: on-failure
#    healthcheck:
#      test: [ "CMD", "wget", "--spider", "http://localhost:8080/actuator/health" ]
#      interval: 10s
#      timeout: 5s
#      retries: 20
#      start_period: 40s

  #SERVICE DISCOVERY
  consul:
    image: "consul:1.15.3"
    container_name: "consul"
    ports:
      - 8500:8500
    environment:
      CONSUL_BIND_INTERFACE: eth0
      CONSUL_LOCAL_CONFIG: |
        {
          "skip_leave_on_interrupt": true,
          "disable_update_check": true,
          "encrypt": "${CONSUL_ENCRYPT_KEY}",
          "verify_incoming": false,
          "verify_outgoing": false
        }
    command: >
      agent -server -bootstrap -ui
      -client=0.0.0.0
      -log-level=INFO
      -bind=0.0.0.0
    networks:
      - app_network
    healthcheck:
      test: [
        "CMD-SHELL",
        "curl -f http://localhost:8500/v1/status/leader | grep -q '\"Status\":\"leader\"' || exit 1"
      ]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # KEYCLOAK-DATABASE
  keycloak-database:
    image: "postgres:15"
    container_name: "keycloak-database"
    environment:
      POSTGRES_USER: ${KEYCLOAK_DB_USER}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      POSTGRES_DB: ${KEYCLOAK_DB}
    ports:
      - "5435:5432"
    volumes:
      # Монтируем локальную папку для хранения данных БД
      - ./local/keycloak_bd/data/:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - app_network

  # KEYCLOAK-DB-EXPORTER
  keycloak-database-exporter:
    image: prometheuscommunity/postgres-exporter:v0.18.1
    container_name: "keycloak-database-exporter"
    depends_on:
      keycloak-database:
        condition: service_healthy
    environment:
      - DATA_SOURCE_URI=keycloak-database:5432/${KEYCLOAK_DB}?sslmode=disable
      - DATA_SOURCE_USER=${KEYCLOAK_DB_USER}
      - DATA_SOURCE_PASS=${KEYCLOAK_DB_PASSWORD}
    ports:
      - "9188:9187"
    networks:
      - app_network


  # KEYCLOAK
  keycloak:
    image: "quay.io/keycloak/keycloak:21.1.1"
    container_name: "keycloak"
    environment:
      KC_PROFILE: dev  # для разработки
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-database:5432/${KEYCLOAK_DB}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HOSTNAME: 192.168.0.162
      KC_FRONTEND_URL: http://192.168.0.162:8080
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_METRICS_ENABLED: "true"
      KC_FEATURES: metrics,user-event-metrics
      KC_METRICS_ENDPOINTS: "prometheus,health"
      KC_LOG_LEVEL: INFO
      QUARKUS_HTTP_PORT: "8080"
      QUARKUS_HTTPS_PORT: "0"  # Отключён HTTPS
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
    ports:
      - "8090:8080"  # HTTP порт
      - "8443:8443"  # HTTPS порт (если включите позже)
    depends_on:
      keycloak-database:
        condition: service_healthy
    command:
      - start-dev
    volumes:
      - ./local/ssl/keycloak.p12:/opt/keycloak/conf/keycloak.p12:ro
    networks:
      - app_network
    healthcheck:
      test: >
        bash -c '
          if ! wget --no-check-certificate --quiet --spider http://localhost:8080/health/ready; then
            exit 1
          fi;
          exit 0
        '
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 40s
    restart: always


  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # Веб‑консоль
      - "9095:9090"  # Метрики Prometheus
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
      MINIO_PROMETHEUS_AUTH_TYPE: "public"  # Упрощённый доступ к метрикам
    volumes:
      - ./local/minio/data/:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped
    expose:
      - 9090  # Порт для метрик
    networks:
      - app_network


  # CACHE
  redis:
    image: "redis:7"
    container_name: "redis"
    command: [ "redis-server", "--requirepass", "${REDIS_PASSWORD}" ]
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    networks:
      - app_network
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "$REDIS_PASSWORD", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 5


  redis-exporter:
    image: oliver006/redis_exporter:v1.80.1
    container_name: "redis-exporter"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_ADDR=redis://${REDIS_HOST}:${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    ports:
      - "9122:9121"
    networks:
      - app_network

  # Хранение метрик
  prometheus:
    image: prom/prometheus:v3.9.1
    container_name: "prometheus"
    ports:
      - "9091:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 30

  # Хранение логов
  loki:
    image: grafana/loki:main-3acb310
    container_name: "loki"
    ports:
      - "3100:3100"
    volumes:
      - ./infrastructure/loki/config/config.yml:/etc/loki/config.yml:ro
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 30

  # Хранение трейсов
  tempo:
    image: grafana/tempo:2.4.1
    container_name: "tempo"
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    ports:
      - "3200:3200"
    volumes:
      - ./infrastructure/tempo/config/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo/traces
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f localhost:3200/api/health && echo 'ready'"]
      interval: 10s
      timeout: 5s
      retries: 30

  # Агент для сбора- и передачи метрик, логов и трейсов
  alloy:
    image: grafana/alloy:v1.12.2
    container_name: "alloy"
    user: root
    ports:
      - "9080:9080" # HTTP
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    volumes:
      - ./infrastructure/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/log:/var/log:ro
    environment:
      GRAFANA_LOKI_URL: http://loki:3100/loki/api/v1/push
    networks:
      - app_network
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:9080
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy

  #UI для телеметрии
  grafana:
    image: grafana/grafana:12.4.0-20836657505
    container_name: "grafana"
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: true
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_METRICS_ENABLED: true
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
      tempo:
        condition: service_started
      alloy:
        condition: service_started
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 60

  # ELASTICSEARCH
  elasticsearch:
    image: "docker.elastic.co/elasticsearch/elasticsearch:8.13.0"
    container_name: "elasticsearch"
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - ./local/elasticsearch/data:/usr/share/elasticsearch/data
    networks:
      - app_network
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9200 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  elasticsearch-exporter:
    image: "prometheuscommunity/elasticsearch-exporter:v1.8.0"
    container_name: "elasticsearch-exporter"
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "9114:9114"
    environment:
      - ELASTICSEARCH_URI=http://elasticsearch:9200
    command:
      - "--es.uri=http://elasticsearch:9200"
      - "--web.listen-address=:9114"
    networks:
      - app_network
    healthcheck:
      test: [ "CMD", "wget", "--spider", "http://localhost:9114/metrics" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped



  kafka:
    image: apache/kafka:4.2.0
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - app_network
    healthcheck:
      test: [
        "CMD-SHELL",
        "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 --command-config /opt/kafka/config/client.properties || exit 1"
      ]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 300s  # Увеличен до 5 минут

  kafka-exporter:
    image: "danielqsj/kafka-exporter:v1.7.0"
    container_name: "kafka-exporter"
    depends_on:
      kafka:
        condition: service_started
    ports:
      - "9308:9308"
    environment:
      KAFKA_EXPORTER_KAFKA_SERVER: "kafka:9092"
    command:
      - "--kafka.server=kafka:9092"
      - "--web.listen-address=:9308"
    networks:
      - app_network
    healthcheck:
      test: [ "CMD", "wget", "--spider", "http://localhost:9308/metrics" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  app_network:
    driver: bridge

volumes:
  tempo_data:
  loki_data:
  loki_chunks:
  loki_index:
  loki_rules:
  kafka-data:
  consul_data: